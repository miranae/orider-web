name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify commit sign-offs
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          base_ref="${{ github.event.pull_request.base.ref }}"
          node --test scripts/check-dco.test.mjs
          if ! node scripts/check-dco.mjs "$base" "$head"; then
            printf '%s\n' \
              "" \
              "To fix your latest commit:" \
              "  git commit --amend -s --no-edit" \
              "  git push --force-with-lease" \
              "" \
              "To fix several commits, rebase and amend each missing commit:" \
              "  git rebase -i origin/$base_ref" \
              "  git commit --amend -s --no-edit" \
              "" \
              "For shared protected branches, use a signed individual remediation commit (CONTRIBUTING.md)."
            exit 1
          fi
