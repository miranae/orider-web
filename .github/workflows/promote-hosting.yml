name: Promote verified Hosting artifact

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Validated development FE run ID
        required: true
      candidate_run_attempt:
        description: Development run attempt
        required: true
        default: '1'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-hosting-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, web-hosting]
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record workflow and preparation start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "WORKFLOW_CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)" >> "$GITHUB_ENV"
          echo "PREPARATION_STARTED_AT_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
          echo "CLIENT_PROMOTION_DIRECTORY=$RUNNER_TEMP/client-promotion" >> "$GITHUB_ENV"
      - name: Auth (production Hosting and candidate reader)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Restore validated development candidate
        env:
          HOSTING_CANDIDATE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          node scripts/hosting-candidate-archive.mjs --phase restore --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" --directory "$RUNNER_TEMP/client-candidate"
      - name: Prepare production routing and check gateway once
        env:
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          set -euo pipefail
          candidate_sha=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/client-candidate/archive.json")).frontendSourceSha')
          if ! git cat-file -e "$candidate_sha^{commit}"; then git fetch --no-tags origin "$candidate_sha"; fi
          node scripts/promote-bundled-client.mjs --phase prepare --archive "$RUNNER_TEMP/client-candidate/payload" --run "$RUNNER_TEMP/client-candidate/run.json" --artifact "$RUNNER_TEMP/client-candidate/archive.json" --attempt "$CANDIDATE_ATTEMPT"
          node scripts/promote-bundled-client.mjs --phase verify
          echo "PREPARED_AT_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Publish the same compiled files
        env:
          HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "PUBLISH_STARTED_AT_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
          if ! command -v firebase >/dev/null; then npm install -g firebase-tools; fi
          source_sha=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.CLIENT_PROMOTION_DIRECTORY+"/promotion.json")).frontendSourceSha')
          firebase deploy --config firebase.bundled-production.json --only hosting --project miranae-orider-g1 --non-interactive --token "$HOSTING_ACCESS_TOKEN" --message "client-promotion:$source_sha:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          echo "PUBLISHED_AT_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Check public release once
        run: |
          set -euo pipefail
          echo "PUBLIC_CHECK_STARTED_AT_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
          node scripts/promote-bundled-client.mjs --phase published
          echo "VERIFIED_AT_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - name: Report actual elapsed time
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const env=process.env, end=Date.now(), created=Date.parse(env.WORKFLOW_CREATED_AT);
          const elapsed=(start,finish=end)=>Number.isFinite(Number(start))&&start?finish-Number(start):null;
          const timing={status:env.JOB_STATUS,workflowCreatedAt:env.WORKFLOW_CREATED_AT||null,reportAt:new Date(end).toISOString(),
            dispatchToReportMs:Number.isFinite(created)?end-created:null,
            setupAndQueueMs:Number.isFinite(created)&&env.PREPARATION_STARTED_AT_MS?Number(env.PREPARATION_STARTED_AT_MS)-created:null,
            preparationMs:elapsed(env.PREPARATION_STARTED_AT_MS,Number(env.PREPARED_AT_MS)||end),
            publicationMs:elapsed(env.PUBLISH_STARTED_AT_MS,Number(env.PUBLISHED_AT_MS)||end),
            publicCheckMs:elapsed(env.PUBLIC_CHECK_STARTED_AT_MS,Number(env.VERIFIED_AT_MS)||end),rebuilt:false};
          console.log(JSON.stringify(timing));
          appendFileSync(env.GITHUB_STEP_SUMMARY,`Status: ${timing.status}\n\nActual timings (ms):\n\n\`\`\`json\n${JSON.stringify(timing,null,2)}\n\`\`\`\n\nFinal workflow total including cleanup: GitHub run created_at → updated_at after completion. No application install, build or intermediate artifact transfer.\n`);
          JS
