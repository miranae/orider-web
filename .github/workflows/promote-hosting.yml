name: Promote verified Hosting artifact

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Rehearse prepares the exact files without publishing
        type: choice
        options: [rehearse, promote]
        default: rehearse
      candidate_run_id:
        description: Successful Deploy (Hosting → stage) run ID
        required: true
      candidate_run_attempt:
        description: Successful run attempt
        required: true
        default: '1'

permissions:
  contents: read
  actions: read
  attestations: read
  id-token: write

# 운영 게시자를 하나로 직렬화한다. 기존 태그 배포도 같은 그룹을 쓴다.
concurrency:
  group: deploy-hosting-production
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: stage
    outputs:
      frontend_source: ${{ steps.prepare.outputs.frontend_source }}
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install verification tools (no build)
        run: npm ci
      - name: Auth (private candidate archive reader)
        id: archive_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGE_GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Restore immutable private development candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          HOSTING_CANDIDATE_ACCESS_TOKEN: ${{ steps.archive_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node -e 'for(const v of [process.env.CANDIDATE_RUN,process.env.CANDIDATE_ATTEMPT])if(!/^[1-9][0-9]*$/.test(v||""))throw Error("positive run/attempt required")'
          # Run metadata may expire. Artifact attestation is verified before extracting the private archive.
          status=$(curl -sS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/$CANDIDATE_ATTEMPT" -o "$RUNNER_TEMP/candidate-run.json" -w '%{http_code}')
          run_args=()
          if [ "$status" = 200 ]; then
            run_args=(--run "$RUNNER_TEMP/candidate-run.json")
          elif [ "$status" != 404 ]; then
            echo "::error::Candidate run metadata HTTP$status"; exit 1
          fi
          node scripts/hosting-candidate-archive.mjs --phase restore --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" --directory "$RUNNER_TEMP/client-candidate" "${run_args[@]}"
      - name: Prepare identical compiled files with production runtime
        id: prepare
        env:
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          set -euo pipefail
          candidate_sha=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/client-candidate/archive.json")).frontendSourceSha')
          if ! git cat-file -e "$candidate_sha^{commit}"; then git fetch --no-tags origin "$candidate_sha"; fi
          node scripts/promote-bundled-client.mjs --phase prepare --archive "$RUNNER_TEMP/client-candidate/payload" --directory "$RUNNER_TEMP/client-promotion" --run "$RUNNER_TEMP/client-candidate/run.json" --artifact "$RUNNER_TEMP/client-candidate/archive.json" --attempt "$CANDIDATE_ATTEMPT"
          source_sha=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/client-promotion/promotion.json")).frontendSourceSha')
          echo "frontend_source=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=client-promotion-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "Reused development candidate: $source_sha. JavaScript/static files unchanged; runtime and Hosting routes prepared for production. No build or production publication." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain prepared promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          include-hidden-files: true
          retention-days: 1
          path: |
            dist
            firebase.bundled-production.json
            ${{ runner.temp }}/client-promotion/promotion.json

  promote:
    if: inputs.phase == 'promote'
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64, web-hosting]
    environment: production
    env:
      ORIDER_HOSTING_RELEASE_ENVIRONMENT: production
      ORIDER_HOSTING_SERIALIZED_WRITES: 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Select promotion receipt directory
        run: echo "CLIENT_PROMOTION_DIRECTORY=$RUNNER_TEMP/client-production" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/client-ready
      - name: Restore prepared production files
        run: |
          node --input-type=module <<'JS'
          import {readdirSync,cpSync,mkdirSync} from 'node:fs';
          import {join,dirname} from 'node:path';
          const root=join(process.env.RUNNER_TEMP,'client-ready');
          const find=(dir,name)=>readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?find(join(dir,e.name),name):e.name===name?[join(dir,e.name)]:[]);
          const configs=find(root,'firebase.bundled-production.json'),receipts=find(root,'promotion.json');
          if(configs.length!==1||receipts.length!==1)throw Error('one prepared client required');
          cpSync(join(dirname(configs[0]),'dist'),'dist',{recursive:true});
          cpSync(configs[0],'firebase.bundled-production.json');
          mkdirSync(process.env.CLIENT_PROMOTION_DIRECTORY);
          cpSync(receipts[0],join(process.env.CLIENT_PROMOTION_DIRECTORY,'promotion.json'));
          JS
      - name: Verify unchanged files and exact production backend
        run: node scripts/promote-bundled-client.mjs --phase verify
      - name: Auth (production Hosting only)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Record previous production Hosting release
        id: hosting_snapshot
        env:
          FRONTEND_SOURCE: ${{ needs.prepare.outputs.frontend_source }}
          HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          export HOSTING_DEPLOYMENT_MARKER="client-promotion:$FRONTEND_SOURCE:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          node scripts/bundled-stage-hosting-release.mjs --phase snapshot --file "$RUNNER_TEMP/production-hosting-before.json"
      - name: Publish verified artifact (no build)
        id: publish
        env:
          FRONTEND_SOURCE: ${{ needs.prepare.outputs.frontend_source }}
          HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          npm install -g firebase-tools
          node scripts/bundled-stage-hosting-release.mjs --phase check-publish --file "$RUNNER_TEMP/production-hosting-before.json"
          firebase deploy --config firebase.bundled-production.json --only hosting --project miranae-orider-g1 --non-interactive --token "$HOSTING_ACCESS_TOKEN" --message "client-promotion:$FRONTEND_SOURCE:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
      - name: Verify production entry, runtime and aliases
        run: |
          node scripts/promote-bundled-client.mjs --phase check-files
          node scripts/verify-bundled-hosting.mjs --environment production
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {stageHtmlEntry} from './scripts/lib/stage-artifact-manifest.mjs';
          const get=async path=>{const r=await fetch(`https://orider.co.kr/${path}?promotion=${process.env.GITHUB_RUN_ID}`,{cache:'no-store',redirect:'error',signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error(`production ${path} HTTP${r.status}`);return r.text();};
          if(await get('runtime-config.json')!==readFileSync('dist/runtime-config.json','utf8'))throw Error('production runtime differs');
          if(stageHtmlEntry(await get(''),'live production HTML','https://orider.co.kr')!==stageHtmlEntry(readFileSync('dist/index.html','utf8'),'built production HTML','https://orider.co.kr'))throw Error('production entry differs');
          JS
      - name: Restore this run's previous production Hosting release on failure
        if: always() && (failure() || cancelled()) && steps.hosting_snapshot.outcome == 'success' && steps.publish.outcome != 'skipped' && steps.publish.outcome != ''
        timeout-minutes: 3
        env:
          HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/bundled-stage-hosting-release.mjs --phase rollback --file "$RUNNER_TEMP/production-hosting-before.json"
      - name: Record promoted source
        env:
          FRONTEND_SOURCE: ${{ needs.prepare.outputs.frontend_source }}
        run: echo "Published verified frontend $FRONTEND_SOURCE from development run ${{ inputs.candidate_run_id }}/${{ inputs.candidate_run_attempt }} without rebuilding. Production entry bytes, runtime and HTTP aliases verified." >> "$GITHUB_STEP_SUMMARY"
