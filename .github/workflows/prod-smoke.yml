name: Production smoke (mobile viewport)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ["Deploy (Hosting → production)"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: production-monitor-${{ github.event_name }}-${{ github.event.workflow_run.id || 'periodic' }}
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/production-monitor-run.yml
    with:
      source_repo: ${{ github.event_name == 'workflow_run' && github.repository || '' }}
      source_run: ${{ github.event.workflow_run.id && format('{0}', github.event.workflow_run.id) || '' }}
