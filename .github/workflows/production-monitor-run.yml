name: Run production monitor
on:
  workflow_call:
    inputs:
      runner_labels:
        type: string
        default: '["ubuntu-latest"]'
      source_repo:
        type: string
        default: ''
      source_run:
        type: string
        default: ''
      source_attempt:
        type: string
        default: ''
      source_sha:
        type: string
        default: ''
      source_conclusion:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    defaults:
      run:
        working-directory: production-monitor-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          repository: miranae/orider-web
          path: production-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          ref: fdf607876053e16bd37a5e51a9b6fbe376841eee # reviewed checker code; caller cannot select executable code
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Resolve exact deployment attempt and wait until completion plus five minutes
        id: source
        if: inputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_SOURCE_REPO: ${{ inputs.source_repo }}
          MONITOR_SOURCE_RUN: ${{ inputs.source_run }}
          MONITOR_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          MONITOR_SOURCE_SHA: ${{ inputs.source_sha }}
          MONITOR_SOURCE_CONCLUSION: ${{ inputs.source_conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-monitor-source.mjs | tee source-deployment.json
      - name: Read anonymous Korean and English live feeds
        if: inputs.source_run == '' || steps.source.outputs.should_check == 'true'
        env:
          MONITOR_SOURCE_EVIDENCE: ${{ inputs.source_run != '' && 'source-deployment.json' || '' }}
          MONITOR_TRIGGER: ${{ inputs.source_run != '' && format('production-deploy-{0}-plus-five-minutes', steps.source.outputs.outcome) || github.event_name }}
        run: node scripts/production-monitor.mjs
      - name: Existing mobile viewport smoke
        if: inputs.source_run == '' || steps.source.outputs.should_check == 'true'
        run: npx playwright test --config playwright.prod.config.ts
      - name: Store result and privacy-safe failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            production-monitor-${{ github.run_id }}-${{ github.run_attempt }}/production-monitor-results/
            production-monitor-${{ github.run_id }}-${{ github.run_attempt }}/source-deployment.json
            production-monitor-${{ github.run_id }}-${{ github.run_attempt }}/test-results/
          retention-days: 14
          if-no-files-found: error
      - name: Failure signal for existing GitHub notifications and parent monitor
        if: failure()
        run: echo '::error::Production monitor failed. Inspect result.json and evidence before following the verified Hosting recovery runbook.'
