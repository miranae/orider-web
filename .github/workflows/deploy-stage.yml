name: Deploy (Hosting → stage)

# 개발 코드는 orider-dev Hosting에 배포하며 데이터·기능 기본값은 현재 운영 snapshot을 사용한다.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-hosting-stage
  cancel-in-progress: true

jobs:
  deploy-stage:
    # 수동 실행도 dev로 제한하고 일회성 GitHub 러너를 사용한다.
    if: github.ref == 'refs/heads/dev'
    # dev 코드를 운영 전용 러너에서 실행하지 않는다.
    runs-on: ubuntu-latest
    environment: stage
    env:
      VITE_MODE: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set production runtime snapshot path
        env:
          PRODUCTION_RUNTIME_CONFIG_PATH: ${{ runner.temp }}/orider-production-runtime-config.json
        run: echo "PRODUCTION_RUNTIME_CONFIG_PATH=$PRODUCTION_RUNTIME_CONFIG_PATH" >> "$GITHUB_ENV"
      - name: Pin production data runtime and verify backend CORS
        run: node scripts/prepare-production-data-runtime.mjs
      - name: Check development Hosting and production data identity
        env:
          STAGE_FIREBASE_PROJECT_ID: ${{ vars.STAGE_FIREBASE_PROJECT_ID }}
        run: node scripts/check-isolated-stage.mjs
      - name: Check canonical deploy flags
        run: node scripts/check-canonical-deploy-env.mjs
      - run: npm ci
      - name: Check deploy config
        run: npm run check:deploy-config
      - name: Build
        run: npm run build
      - name: Write stage runtime config
        run: npm run write:runtime-config
      - name: Auth (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGE_GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
      - name: Deploy stage Hosting only
        run: |
          set -euo pipefail
          npm install -g firebase-tools
          set +e
          firebase deploy \
            --config firebase.stage.json \
            --only hosting \
            --project "${{ vars.STAGE_FIREBASE_PROJECT_ID }}" \
            --non-interactive \
            --token "${{ steps.auth.outputs.access_token }}" 2>&1 | tee firebase-stage-deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q "is the current active version" firebase-stage-deploy.log; then
            echo "Firebase Hosting stage version is already active; treating deploy as idempotent success."
            exit 0
          fi
          exit "$status"
      - name: Verify stage deploy
        run: |
          set -euo pipefail
          built=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$built" ]; then echo "::error::빌드 index.html 에서 entry 청크를 못 찾음"; exit 1; fi
          echo "built entry: $built"
          ok=0
          for i in $(seq 1 10); do
            live=$(curl -fsSL -H 'Cache-Control: no-cache' "https://orider-dev.web.app/?cacheBust=${GITHUB_SHA}-$i" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            echo "attempt $i: stage entry = ${live:-<none>}"
            if [ "$live" = "$built" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::stage가 방금 빌드한 번들($built)을 서빙하지 않음 — stale 배포/캐시."
            exit 1
          fi
          curl -fsSL -H 'Cache-Control: no-cache' "https://orider-dev.web.app/runtime-config.json?cacheBust=${GITHUB_SHA}" -o "$RUNNER_TEMP/live-runtime-config.json"
          if ! cmp -s dist/runtime-config.json "$RUNNER_TEMP/live-runtime-config.json"; then
            echo "::error::개발 사이트의 runtime 설정이 고정한 운영 snapshot과 다릅니다."
            exit 1
          fi
