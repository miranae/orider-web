name: Deploy (Hosting → stage)

# main에 머지된 빌드를 운영 태그 배포 전에 검증할 수 있는 영구 stage Hosting site로 배포한다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-hosting-stage
  cancel-in-progress: true

jobs:
  deploy-stage:
    # 수동 실행도 main으로 제한해 PR/임의 ref 코드를 영구 러너에서 실행하지 않는다.
    if: github.ref == 'refs/heads/main'
    # main 승격 산출물만 실행하는 전용 로컬 Hosting 러너.
    runs-on: [self-hosted, macOS, ARM64, web-hosting]
    environment: stage
    env:
      # Stage uses STAGE_* values only. Do not fall back to production repository
      # secrets/vars, otherwise OAuth/App Check issues are hidden until release.
      VITE_FIREBASE_API_KEY: ${{ secrets.STAGE_VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGE_VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.STAGE_VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.STAGE_VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGE_VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.STAGE_VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_FUNCTIONS_REGION: ${{ vars.STAGE_VITE_FIREBASE_FUNCTIONS_REGION }}
      VITE_STRAVA_CLIENT_ID: ${{ secrets.STAGE_VITE_STRAVA_CLIENT_ID }}
      VITE_STRAVA_REDIRECT_URI: ${{ vars.STAGE_VITE_STRAVA_REDIRECT_URI }}
      VITE_SEGMENT_TILES_BASE: ${{ vars.STAGE_VITE_SEGMENT_TILES_BASE }}
      VITE_HEATMAP_BASE: ${{ vars.STAGE_VITE_HEATMAP_BASE }}
      VITE_MAPBOX_TOKEN: ${{ secrets.STAGE_VITE_MAPBOX_TOKEN }}
      VITE_APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.STAGE_VITE_APPCHECK_RECAPTCHA_SITE_KEY }}
      VITE_ORIDER_AI_API_BASE: ${{ vars.STAGE_VITE_ORIDER_AI_API_BASE }}
      VITE_COACH_PROGRESS_PLANNER_ENABLED: ${{ vars.STAGE_VITE_COACH_PROGRESS_PLANNER_ENABLED }}
      VITE_COACH_PMC_INSIGHT_ENABLED: ${{ vars.STAGE_VITE_COACH_PMC_INSIGHT_ENABLED }}
      VITE_COACH_RIDER_INSIGHT_ENABLED: ${{ vars.STAGE_VITE_COACH_RIDER_INSIGHT_ENABLED }}
      VITE_TRAINING_DECISION_ENABLED: ${{ vars.STAGE_VITE_TRAINING_DECISION_ENABLED }}
      VITE_TRAINING_EXECUTION_ENABLED: ${{ vars.STAGE_VITE_TRAINING_EXECUTION_ENABLED }}
      VITE_COACH_RIDE_PLAN_TOKEN_ENABLED: ${{ vars.STAGE_VITE_COACH_RIDE_PLAN_TOKEN_ENABLED }}
      VITE_COACH_RIDE_PLAN_SNAPSHOT_ENABLED: ${{ vars.STAGE_VITE_COACH_RIDE_PLAN_SNAPSHOT_ENABLED }}
      VITE_COACH_RIDE_PLAN_AI_ENABLED: ${{ vars.STAGE_VITE_COACH_RIDE_PLAN_AI_ENABLED }}
      VITE_COACH_RIDE_PLAN_RESPOND_V2_ENABLED: ${{ vars.STAGE_VITE_COACH_RIDE_PLAN_RESPOND_V2_ENABLED }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Check deploy config
        run: npm run check:deploy-config
      - name: Build
        run: npm run build
      - name: Write stage runtime config
        run: npm run write:runtime-config
      - name: Auth (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGE_GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
      - name: Verify stage backend social callable contract
        env:
          SOCIAL_CALLABLES_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: >-
          node scripts/verify-social-callables.mjs
          --project "${{ vars.STAGE_VITE_FIREBASE_PROJECT_ID }}"
          --region "${{ vars.STAGE_VITE_FIREBASE_FUNCTIONS_REGION }}"
      - name: Auth stage smoke signer (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.AI_COACH_STAGE_COLLECTOR_WIF_PROVIDER }}
          service_account: ${{ vars.AI_COACH_STAGE_COLLECTOR_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Exercise Today decision and execution contracts with Auth and App Check
        env:
          TODAY_TRAINING_STAGE_COMMIT_SHA: ${{ github.sha }}
          TODAY_TRAINING_STAGE_PROJECT_ID: ${{ vars.STAGE_VITE_FIREBASE_PROJECT_ID }}
          TODAY_TRAINING_STAGE_SERVICE_URL: ${{ vars.STAGE_VITE_ORIDER_AI_API_BASE }}
          TODAY_TRAINING_STAGE_SERVICE_ACCOUNT: ${{ vars.AI_COACH_STAGE_COLLECTOR_SERVICE_ACCOUNT }}
          TODAY_TRAINING_STAGE_APP_ID: ${{ secrets.STAGE_VITE_FIREBASE_APP_ID }}
          TODAY_TRAINING_STAGE_WEB_API_KEY: ${{ secrets.STAGE_VITE_FIREBASE_API_KEY }}
          TODAY_TRAINING_STAGE_ELIGIBLE_UID: ${{ vars.STAGE_TRAINING_EXECUTION_ELIGIBLE_UID }}
          TODAY_TRAINING_STAGE_INELIGIBLE_UID: ${{ vars.STAGE_TRAINING_EXECUTION_INELIGIBLE_UID }}
        run: |
          node scripts/run-today-training-stage-smoke.mjs .artifacts/today-training-stage-smoke.json
          node scripts/verify-today-training-stage-evidence.mjs \
            .artifacts/today-training-stage-smoke.json "$GITHUB_SHA" "$TODAY_TRAINING_STAGE_PROJECT_ID"
      - name: Deploy stage Hosting only
        run: |
          set -euo pipefail
          npm install -g firebase-tools
          set +e
          firebase deploy \
            --config firebase.stage.json \
            --only hosting \
            --project "${{ vars.STAGE_FIREBASE_PROJECT_ID }}" \
            --non-interactive \
            --token "${{ steps.auth.outputs.access_token }}" 2>&1 | tee firebase-stage-deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q "is the current active version" firebase-stage-deploy.log; then
            echo "Firebase Hosting stage version is already active; treating deploy as idempotent success."
            exit 0
          fi
          exit "$status"
      - name: Verify stage deploy
        run: |
          set -euo pipefail
          built=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$built" ]; then echo "::error::빌드 index.html 에서 entry 청크를 못 찾음"; exit 1; fi
          echo "built entry: $built"
          ok=0
          for i in $(seq 1 10); do
            live=$(curl -fsSL -H 'Cache-Control: no-cache' "https://miranae-orider-g1-stage.web.app/?cacheBust=${GITHUB_SHA}-$i" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            echo "attempt $i: stage entry = ${live:-<none>}"
            if [ "$live" = "$built" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::stage가 방금 빌드한 번들($built)을 서빙하지 않음 — stale 배포/캐시."
            exit 1
          fi
      - name: Package verified dist for production promotion
        run: tar -czf "web-dist-${GITHUB_SHA}.tar.gz" dist .artifacts/today-training-stage-smoke.json
      - name: Upload verified dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web-dist-${{ github.sha }}.tar.gz
          retention-days: 90
